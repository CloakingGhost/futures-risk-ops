spring:
  application:
    name: collector
  datasource:
    url: jdbc:postgresql://localhost:5432/futures_risk_ops
    # DB 계정도 코드에 두지 않는다. 환경변수가 없으면 시작할 때 실패한다.
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    # 마이그레이션은 collector 만 실행한다(파일은 db 모듈). risk 는 Flyway 를 켜지 않는다.
    enabled: true
    locations: classpath:db/migration

# 지표(/actuator/prometheus)와 상태(/actuator/health)만 연다. 이 PC 안에서만 보이도록 127.0.0.1 에 묶는다.
# 지표 이름과 뜻은 docs/metrics.md. risk 와 겹치지 않게 8081 을 쓴다.
server:
  address: 127.0.0.1
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

# 기본은 로컬 시뮬레이터(./gradlew :simulator:run). KIS 는 --spring.profiles.active=kis
collector:
  enabled: true
  source: SIMULATOR
  ws-url: ws://127.0.0.1:18080/tryitout
  # 구독할 종목. AUTO 는 결제월 규칙(3·6·9·12월 둘째 목요일, 휴장이면 앞당김)과 종목 마스터로 근월물을 고르고,
  # 만기 전날 세션부터 만기일 주간장까지 다음 결제월물을 함께 구독한다. FIXED 는 아래 symbols 를 그대로 쓴다.
  # 주간장은 체결 H0IFCNT0 + 호가 H0IFASP0, 야간장은 체결 H0MFCNT0 을 구독한다.
  instruments:
    mode: AUTO
    quotes: true
    master:
      # 시뮬레이터는 마스터 없이 규칙으로 만든 코드(A01612 형식)를 쓴다. KIS 프로필은 켠다
      download: false
      url: https://new.real.download.dws.co.kr/common/master/fo_idx_code_mts.mst.zip
      refresh-at: "07:30"
  symbols:
    - A01612
  # 끊기면 1, 2, 4, 8 ... 초(최대 30초)에 0~500ms 지터를 더해 기다렸다 다시 붙는다
  reconnect:
    initial-backoff: 1s
    max-backoff: 30s
    max-jitter: 500ms
  # 이 간격으로 웹소켓 ping 을 보낸다. 다음 ping 까지 pong 이 없으면(최대 약 2배 시간) 죽은 연결로 보고 다시 붙는다
  ws-ping-interval: 20s
  session:
    # 장 시간 캘린더. 기본은 jar 에 넣은 저장소의 config/session-calendar.yaml. 다른 파일은 file:경로
    calendar: classpath:session-calendar.yaml
    # 시뮬레이터는 장 시간과 상관없이 붙는다. KIS 프로필은 true(세션 시간에만 접속)
    gating: false
    connect-lead: 1m
  # 구독 중(세션 안)에 이 시간 넘게 체결이 없으면 수신 공백으로 경고한다. 시뮬레이터는 체결이 잦아 짧게 둔다
  stall-threshold: 5s
  # true 면 시작할 때 쌓인 tick_trade 의 거래일·세션을 캘린더 규칙으로 다시 계산한다(한 번만 켜서 쓴다)
  backfill-trade-dates: false
  approval:
    mode: NONE
    rest-base-url: https://openapi.koreainvestment.com:9443
    # 환경변수 '이름'이다(값이 아니다). 실전은 이 이름을 쓰고, 모의투자 프로필은 KIS_PAPER_* 로 바꾼다.
    app-key-env: KIS_APP_KEY
    app-secret-env: KIS_APP_SECRET
    # 접속키 유효기간(가정: 24시간, 공식 문서로 확인하지 못함). 지표 collector_token_expiry_timestamp_seconds 계산에만 쓴다
    key-ttl: 24h
  batch:
    queue-capacity: 100000
    max-size: 500
    flush-interval-ms: 200
