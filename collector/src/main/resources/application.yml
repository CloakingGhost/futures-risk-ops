spring:
  application:
    name: collector
  datasource:
    url: jdbc:postgresql://localhost:5432/futures_risk_ops
    # DB 계정도 코드에 두지 않는다. 환경변수가 없으면 시작할 때 실패한다.
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    # 마이그레이션은 collector 만 실행한다(파일은 db 모듈). risk 는 Flyway 를 켜지 않는다.
    enabled: true
    locations: classpath:db/migration

# 기본은 로컬 시뮬레이터(./gradlew :simulator:run). KIS 는 --spring.profiles.active=kis
collector:
  enabled: true
  source: SIMULATOR
  ws-url: ws://127.0.0.1:18080/tryitout
  symbols:
    - A01612
  max-reconnect-backoff: 30s
  approval:
    mode: NONE
    rest-base-url: https://openapi.koreainvestment.com:9443
    # 환경변수 '이름'이다(값이 아니다). 실전은 이 이름을 쓰고, 모의투자 프로필은 KIS_PAPER_* 로 바꾼다.
    app-key-env: KIS_APP_KEY
    app-secret-env: KIS_APP_SECRET
  batch:
    queue-capacity: 100000
    max-size: 500
    flush-interval-ms: 200
