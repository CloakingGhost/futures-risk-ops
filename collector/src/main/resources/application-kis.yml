# KIS 실전 연결. 앱키·시크릿은 환경변수 KIS_APP_KEY, KIS_APP_SECRET 에서만 읽는다(없으면 시작할 때 실패).
# 웹소켓 주소는 공식 샘플(kis_auth.py)의 실전 주소다(가정: 실제 접속으로 아직 확인하지 않음).
# 구독 키(tr_key)가 REST 의 A01612 형식과 같은지는 야간장 실체결로 확인한다. 다르면 symbols 만 바꾼다.
# 받은 실제 시세는 로컬 DB 에만 쌓인다. 캡처 파일이 필요하면 local-data/ 에만 둔다.
collector:
  source: KIS
  ws-url: ws://ops.koreainvestment.com:21000/tryitout
  approval:
    mode: KIS
