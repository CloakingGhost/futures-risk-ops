# 코스피200 선물 장 시간 캘린더. 언어와 상관없는 데이터 파일이다.
# collector(Java)가 읽고, Day 8 부터는 같은 파일을 쿠버네티스 ConfigMap 으로 쓴다.
# 알람(Day 9), 장애 주입 안전장치(Day 16), 수능일 특수 개장(Day 24)도 이 파일 하나만 본다.
#
# 시각은 모두 한국 시간(timezone). 토·일은 적지 않아도 휴장이다.
# 휴장일·특수 개장은 해마다 KRX 공지로 확인해 더한다. 아래 값 중 '가정'이라고 적은 것은 아직 공지로 확인하지 않았다.

timezone: Asia/Seoul

# 평일 기본 장 시간. 야간장은 그날 18:00 에 열려 다음 날 06:00 에 끝난다(금요일 야간장은 토요일 06:00 종료).
# 야간장은 거래일(휴장일·주말이 아닌 날) 저녁에만 열린다고 본다(가정).
regular:
  day:   { open: "08:45", close: "15:45" }
  night: { open: "18:00", close: "06:00" }

# 야간장 체결을 어느 거래일(trade_date)로 볼지.
#   next_trading_day: 야간장이 열린 날의 다음 거래일 (금요일 야간장 → 다음 주 월요일)
#   open_date:        야간장이 열린 날 (금요일 야간장 → 금요일)
# 가정: next_trading_day. KRX 야간 파생상품시장 업무규정으로 확인하기 전까지의 가정이다. 확인 뒤 이 값만 바꾼다.
night_trade_date: next_trading_day

# 휴장일(주간장·야간장 모두 없음). 2026-10-28 이후만 적었다. 연말 휴장일(12/31)은 KRX 관례(가정).
holidays:
  - { date: 2026-12-25, name: 성탄절 }
  - { date: 2026-12-31, name: 연말 휴장일 }
  - { date: 2027-01-01, name: 신정 }

# 특수 개장: 그날만 장 시간을 덮어쓴다. day / night 중 적은 것만 바뀐다. closed 로 적으면 그 세션이 없다.
overrides:
  - date: 2026-11-19
    reason: 대학수학능력시험 (개장·마감 1시간 늦춤, 가정 - Day 24 에 KRX 공지로 확인)
    day: { open: "09:45", close: "16:45" }
