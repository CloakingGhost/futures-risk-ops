# 시뮬레이터 설정 예시. 사용: --config=simulator/config/simulator.example.properties
# 우선순위: 기본값 < 이 파일 < 환경변수(SIM_*) < 명령행(--키=값)
# 지정하지 않은 키는 기본값을 쓴다. 모르는 키를 적으면 시작할 때 오류가 난다.

# 서버
server.host=127.0.0.1
server.port=18080

# 속도: 종목당 초당 체결 수 (Day 1 검증용으로 100 까지 올려 볼 수 있다)
rate.ticks-per-second=20
rate.jitter=0.2

# 지연: 체결 시각은 그대로 두고 전송만 늦춘다 (고정 + 0~지터 + 가끔 스파이크)
delay.fixed-ms=0
delay.jitter-ms=0
delay.spike-probability=0
delay.spike-ms=0

# 끊김: 연결 후 N초 뒤 서버가 끊거나, 체결마다 확률로 끊는다
disconnect.after-seconds=0
disconnect.probability-per-tick=0
# true = close 프레임 없이 TCP 리셋(비정상 종료), false = close code 1001
disconnect.abrupt=false

# 조용한 중단: 연결은 유지한 채 전송만 멈춘다 (멈춘 동안의 체결은 버린다)
stall.after-seconds=0
stall.duration-seconds=0
stall.repeat=false

# 서버가 보내는 PINGPONG 간격(초), 0 = 안 보냄
pingpong.interval-seconds=30

# 가격 (전부 합성값)
price.base=400.00
price.tick-size=0.05
price.volatility-ticks=1.5
# 같은 값을 주면 같은 가격 경로가 재현된다
# price.seed=42
