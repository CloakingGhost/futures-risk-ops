# collector 차트 값. replicas 는 값이 아니다: 템플릿에 1 로 고정했고, values.schema.json 이 replicas·replicaCount·
# autoscaling 같은 키를 거절한다(collector 를 둘 띄우면 KIS 접속이 충돌하고 체결이 중복 적재된다. collector/CLAUDE.md).

# 이미지는 레지스트리 없이 `k3d image import` 로 넣는다(deploy/k3d/up.sh --import). GHCR 푸시는 Day 11 CI 에서 한다.
image:
  repository: futures-risk-ops-collector
  tag: local
  pullPolicy: Never

# kis: KIS 실전, kis-paper: 모의투자. 시뮬레이터(default)는 클러스터에서 쓰지 않는다.
profile: kis

# Secret 은 이름만 받는다. 값은 이 차트에 없다(절대 규칙 2). 실제 Secret 은 Day 8 스크립트가 만든다.
secrets:
  # 키: profile 이 kis 면 KIS_APP_KEY, KIS_APP_SECRET / kis-paper 면 KIS_PAPER_APP_KEY, KIS_PAPER_APP_SECRET
  kis: kis-credentials
  # 키: POSTGRES_USER, POSTGRES_PASSWORD
  db: postgres-credentials

datasource:
  url: jdbc:postgresql://postgres:5432/futures_risk_ops

# 장 시간 캘린더. 원본은 저장소 루트 config/session-calendar.yaml 한 곳이다. 설치할 때 그 파일을 그대로 넣는다(필수):
#   helm install collector deploy/helm/collector --set-file sessionCalendar=config/session-calendar.yaml
sessionCalendar: ""

# 거래일 주간장 마감 뒤 KIS 일봉 수집(docs/kis-daily-bar.md). collector.daily-close.* 와 같은 뜻이다.
dailyClose:
  runOnStart: false
  markets: [F]
  lookbackDays: 5

# 힙은 컨테이너 메모리 한도(limits)의 75% 까지
javaOpts: "-XX:MaxRAMPercentage=75"

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 512Mi

# 지표 수집(Day 9). ServiceMonitor 는 Prometheus Operator(kube-prometheus-stack)가 설치된 클러스터에서만 켠다.
# 켜는 upgrade 가 파드 템플릿을 바꾸지는 않지만, 스택이 없는 클러스터에서는 CRD 가 없어 렌더링되지 않는다(.Capabilities 로 확인).
monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
