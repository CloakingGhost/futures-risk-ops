# 클러스터 안에서 지표(/actuator/prometheus)를 읽는 용도(Day 9). 바깥으로는 열지 않는다(ClusterIP).
apiVersion: v1
kind: Service
metadata:
  name: collector
  labels:
    app.kubernetes.io/name: collector
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: margin-watch
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: collector
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: management
      port: 8081
      targetPort: management
