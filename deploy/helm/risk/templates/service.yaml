# 클러스터 안에서 리스크 API 를 부르는 용도. 바깥으로는 열지 않는다(ClusterIP).
apiVersion: v1
kind: Service
metadata:
  name: risk
  labels:
    app.kubernetes.io/name: risk
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: margin-watch
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: risk
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8082
      targetPort: http
