{{- /*
  Prometheus Operator 의 ServiceMonitor(Day 9). risk Service 의 'http' 포트(8082). /actuator/prometheus 는 PR 14(feat/day9-risk-metrics)가 연다. 그 전에는 404 라서 켜지 않는다.
  monitoring.serviceMonitor.enabled 가 true 이고 클러스터에 CRD(monitoring.coreos.com/v1)가 있을 때만 만든다.
  CRD 가 없는 클러스터에서 켜 두면 설치가 깨지므로 Capabilities 로 한 번 더 감쌌다.
  (helm template 은 기본으로 Capabilities 가 비어 있다. 확인할 때는 --api-versions monitoring.coreos.com/v1 을 붙인다)
*/ -}}
{{- if and .Values.monitoring.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: risk
  labels:
    app.kubernetes.io/name: risk
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: margin-watch
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: risk
      app.kubernetes.io/instance: {{ .Release.Name }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
