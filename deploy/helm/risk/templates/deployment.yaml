apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk
  labels:
    app.kubernetes.io/name: risk
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: margin-watch
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: risk
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risk
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: margin-watch
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: risk
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "Never" }}
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: TZ
              value: Asia/Seoul
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.datasource.url | quote }}
            # DB 계정은 Secret 에서만 읽는다. 차트에는 Secret 이름만 있고 값은 없다. risk 는 읽기만 하고 Flyway 를 켜지 않는다.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.db }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.db }}
                  key: POSTGRES_PASSWORD
            - name: RISK_SOURCE
              value: {{ .Values.source | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.javaOpts | quote }}
          # 시작이 느릴 수 있다. startupProbe 가 통과할 때까지 아래 둘은 시작하지 않는다.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
