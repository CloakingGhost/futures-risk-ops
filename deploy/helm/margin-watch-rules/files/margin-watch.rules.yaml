# 마진워치 알람 규칙 8개(Day 9). promtool 형식(groups:)이다. helm 차트가 이 파일을 PrometheusRule 의 spec 으로 감싼다.
# 시험: deploy/monitoring/tests/margin-watch.rules.test.yaml (deploy/monitoring/check.sh 가 돌린다).
#
# 하지 않는 것(사용자 결정, docs 계획 11-1):
#   - 접속키(토큰) 만료 알람: 연결이 이어지는 동안 만료 시각을 지나도 문제가 아니고, 사용자가 따로 알림을 받는다.
#   - 마감 뒤 10초 알람: 마감 뒤 10초는 세션이 닫혔는데 구독 중인 정상 상태라서 이상으로 보지 않는다.
# 알람이 없는 것: collector 가 아예 죽어서 지표가 사라지면 아래 규칙은 값이 없어 울리지 않는다. 그 경우는 스택 기본 알람
# TargetDown(ServiceMonitor 가 켜져 있을 때)과 PodRestartingRepeatedly 가 본다.
groups:
  - name: margin-watch.collector
    rules:
      # ① 장중 체결 수신 중단.
      #   조건: 세션이 열려 있고(collector_market_session_open == 1), 체결을 한 번이라도 받았고(0 은 '아직 없음'),
      #         마지막 체결 수신 뒤 120초가 지났고, 종가 단일가 구간이 아니다.
      #   종가 단일가는 체결이 없어도 정상이다(docs/metrics.md): 주간 15:35~15:45 KST, 야간 05:50~06:00 KST.
      #   Prometheus 의 hour(), minute() 는 UTC 라서 KST - 9시간으로 바꿔 썼다.
      #     주간 15:35~15:45 KST = 06:35~06:45 UTC = 하루 중 395~405분(UTC)
      #     야간 05:50~06:00 KST = 20:50~21:00 UTC = 하루 중 1250~1260분(UTC)  (KST 기준 전날 UTC 저녁이지만 하루 안의 분이라 날짜가 넘어가지 않는다)
      #   구간은 [시작, 끝) 이다(끝 분 00초에 첫 체결이 온다).
      #   값($value)은 마지막 체결 뒤 지난 초다(첫 항이 왼쪽이라 그 값이 남는다).
      #   for 2m: 종가 단일가가 끝나는 정각에는 구간 제외가 풀리는데 첫 체결이 지표에 반영되기까지 스크레이프 간격(30초)만큼 걸린다.
      #           그 사이 잠깐 참이 되는 것을 걸러 낸다. 수신 중단은 120초 + 2분 = 4분쯤 뒤에 알린다.
      #   한산한 야간에 76~85초 공백이 나는 것은 120초 아래라서 알리지 않는다.
      - alert: CollectorNoTradeInSession
        expr: |
          (
              (time() - collector_last_trade_received_timestamp_seconds) > 120
            and
              collector_last_trade_received_timestamp_seconds > 0
            and
              collector_market_session_open == 1
          )
          unless on()
          (
              (hour() * 60 + minute() >= 395  and hour() * 60 + minute() < 405)
            or
              (hour() * 60 + minute() >= 1250 and hour() * 60 + minute() < 1260)
          )
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "장중인데 체결이 들어오지 않는다"
          description: "{{ $labels.job }} ({{ $labels.instance }}) 가 세션이 열려 있는데 마지막 체결을 받은 지 {{ $value | humanizeDuration }} 가 지났다. 종가 단일가 구간(주간 15:35~15:45, 야간 05:50~06:00 KST)은 뺐다."

      # ② 적재 지연 p95. 체결 수신부터 tick_trade 배치 INSERT 가 끝날 때까지(배치 대기 최대 약 0.2초 포함)의 95번째 백분위가 1초를 넘는다.
      #   히스토그램 칸 경계에 1초가 있어서 칸 안 보간 오차가 이 기준에서 가장 작다. 체결이 없으면 rate 가 0 이라 NaN 이고 알리지 않는다.
      - alert: CollectorIngestLatencyP95High
        expr: |
          histogram_quantile(0.95, sum by (job, le) (rate(collector_receive_to_commit_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "체결 적재 지연 p95 가 1초를 넘었다"
          description: "{{ $labels.job }} 의 수신에서 커밋까지 p95 가 {{ $value | humanizeDuration }} 다(기준 1초, 5분 이어짐)."

      # ③ 재접속이 잦다. collector_ws_reconnects_total 은 끊긴 뒤 다시 구독까지 성공한 횟수라서 계속 실패하는 동안에는 늘지 않는다
      #   (그 경우는 collector_ws_state{state="BACKOFF"} 로 본다). 10분에 3번 이상이면 접속이 불안정하다고 본다(가정: 하루 한두 번은 정상).
      - alert: CollectorReconnectsFrequent
        expr: |
          increase(collector_ws_reconnects_total[10m]) >= 3
        labels:
          severity: warning
        annotations:
          summary: "웹소켓 재접속이 10분에 3번 이상이다"
          description: "{{ $labels.job }} ({{ $labels.instance }}) 가 10분 동안 {{ $value | humanize }} 번 다시 접속했다."

      # ④ 끊긴 동안 누락 발생. kind="reconnect" 는 끊긴 동안 빈 누적거래량으로 계산한 확실한 누락이다.
      #   kind="stream"(연결 중 빈틈)은 KIS 묶음 전송일 수 있어서 알리지 않는다.
      - alert: CollectorMissingVolume
        expr: |
          increase(collector_missing_volume_total{kind="reconnect"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "끊긴 동안 체결이 누락됐다"
          description: "{{ $labels.job }} ({{ $labels.instance }}) 가 최근 10분 사이 끊긴 동안 약 {{ $value | humanize }} 계약의 체결을 놓쳤다."

      # ⑧ 일봉 수집이 오래 멈췄다(토큰 만료 알람이 아니다. 토큰 만료 알람은 만들지 않는다).
      #   collector_daily_close_last_success_timestamp_seconds 는 일봉 작업이 마지막으로 성공한 시각(유닉스 초)이다.
      #   값 0 은 '꺼짐 또는 아직 없음'(시뮬레이터, collector 재시작 직후)이라 뺀다.
      #   기준 100시간(약 4일 4시간): 휴장일이 낀 주말·연휴(금요일 16:00 성공 -> 다음 화요일 16:00 전까지)를 견디려고 넓게 잡았다.
      #   한계: 하루만 건너뛴 경우는 잡지 못한다. 사용자는 매일 16:00 KIS '토큰 갱신' 카카오톡으로 성공을 알고, 안 오면 직접 안다.
      #   값($value)은 마지막 성공 뒤 지난 초다(첫 항이 왼쪽이라 그 값이 남는다).
      - alert: CollectorDailyCloseStale
        expr: |
          (time() - collector_daily_close_last_success_timestamp_seconds) > 100 * 3600
          and
          collector_daily_close_last_success_timestamp_seconds > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "일봉 수집이 4일 넘게 성공하지 않았다"
          description: "{{ $labels.job }} ({{ $labels.instance }}) 의 일봉 작업이 마지막으로 성공한 지 {{ $value | humanizeDuration }} 가 지났다(기준 100시간)."

  - name: margin-watch.platform
    rules:
      # ⑤ 노드 디스크 사용률 80% 이상. node-exporter 파일시스템 지표다.
      #   가상 파일시스템(tmpfs, overlay, squashfs 등)과 /dev, /proc, /sys, 컨테이너 런타임 경로는 뺀다.
      #   같은 장치가 여러 경로에 마운트되면(바인드 마운트) 같은 값이 여러 번 나오므로 장치별 최댓값 하나만 본다.
      #   주의: local-path PVC 는 용량을 강제하지 않아 PVC 별 사용률이 아니라 노드 디스크 전체가 기준이다.
      - alert: NodeDiskUsageHigh
        expr: |
          max by (instance, device) (
            1 - (
              node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|fuse.*|nsfs|proc|sysfs|devtmpfs|devpts|cgroup2?|autofs|tracefs|mqueue|binfmt_misc|configfs|debugfs|securityfs|pstore|bpf|fusectl|hugetlbfs", mountpoint!~"/(dev|proc|sys)(/.*)?|/var/lib/(docker|containerd|kubelet)(/.*)?"}
              /
              (node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|fuse.*|nsfs|proc|sysfs|devtmpfs|devpts|cgroup2?|autofs|tracefs|mqueue|binfmt_misc|configfs|debugfs|securityfs|pstore|bpf|fusectl|hugetlbfs", mountpoint!~"/(dev|proc|sys)(/.*)?|/var/lib/(docker|containerd|kubelet)(/.*)?"} > 0)
            )
          ) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "노드 디스크 사용률이 80% 를 넘었다"
          description: "{{ $labels.instance }} 의 {{ $labels.device }} 사용률이 {{ $value | humanizePercentage }} 다(10분 이어짐)."

      # ⑥ DB 연결 풀 사용률 80% 이상. HikariCP 지표(스프링이 자동으로 내보낸다)를 앱(job)과 풀별로 합쳐 본다.
      #   배치 INSERT 가 잠깐 풀을 많이 쓰는 것은 정상이라 5분 이어질 때만 알린다.
      - alert: DbConnectionsHigh
        expr: |
          sum by (job, pool) (hikaricp_connections_active)
          /
          sum by (job, pool) (hikaricp_connections_max)
          > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB 연결 풀이 80% 넘게 찼다"
          description: "{{ $labels.job }} 의 풀 {{ $labels.pool }} 사용률이 {{ $value | humanizePercentage }} 다(5분 이어짐)."

      # ⑦ 파드가 반복해서 재시작한다. margin-watch 네임스페이스에서 30분에 컨테이너 재시작 3회 이상.
      #   크래시 루프는 재시작 사이 간격이 10초, 20초, 40초... 로 늘어나므로 3회는 몇 분 안에 쌓인다. 1~2회(배포·일시 오류)는 알리지 않는다.
      - alert: PodRestartingRepeatedly
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace="margin-watch"}[30m]) >= 3
        labels:
          severity: critical
        annotations:
          summary: "파드가 반복해서 재시작한다"
          description: "{{ $labels.namespace }}/{{ $labels.pod }} 의 컨테이너 {{ $labels.container }} 가 30분 동안 {{ $value | humanize }} 번 재시작했다."
