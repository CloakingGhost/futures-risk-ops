# StatefulSet 의 serviceName 이 가리키는 headless Service(clusterIP: None). 파드 이름(postgres-0)이 DNS 이름을 얻는다.
# 서비스 이름 postgres 로 접속하면 준비된(Ready) 파드의 IP 가 바로 나온다. 클러스터 안에서만 쓴다(바깥으로 열지 않는다).
# 이름을 릴리스와 무관하게 postgres 로 고정한 것은 의도다. collector·risk 의 datasource.url 이 postgres:5432 를 가리키고,
# 다른 릴리스 이름으로 DB 를 하나 더 설치하려 하면 이름이 겹쳐 Helm 이 거절한다.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: margin-watch
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
