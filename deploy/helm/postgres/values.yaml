# postgres 차트 값. replicas 는 값이 아니다: 템플릿에 1 로 고정했고, values.schema.json 이 replicas·password 같은 키를 거절한다
# (DB 를 둘 띄우면 서로 모르는 두 데이터 폴더가 생기고, 이 차트에는 복제 설정이 없다).
# DB 이름(futures_risk_ops)과 서비스 이름(postgres)도 값이 아니다. collector·risk 차트의 datasource.url 이 이 이름을 쓴다.

# 이미지는 노드가 Docker Hub 에서 받는다. 인터넷이 안 되면 `k3d image import postgres:16` 으로 넣고 pullPolicy 를 IfNotPresent 로 둔다.
image:
  repository: postgres
  tag: "16"
  pullPolicy: IfNotPresent

# Secret 은 이름만 받는다. 값은 이 차트에 없다(절대 규칙 2). 키: POSTGRES_USER, POSTGRES_PASSWORD
# 비밀번호는 데이터 폴더를 처음 만들 때만 적용된다. 나중에 Secret 을 바꿔도 이미 만든 DB 의 비밀번호는 바뀌지 않는다.
secretName: postgres-credentials

# local-path 는 reclaim Delete 라서 PVC 를 지우면 데이터도 사라지고, 크기는 강제되지 않는다(요청 값일 뿐이다).
storage:
  size: 10Gi
  storageClassName: local-path

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 1Gi
